<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#4d8dff" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- amber (falling) candle -->
  <line x1="19" y1="12" x2="19" y2="50" stroke="#ffb020" stroke-width="3" stroke-linecap="round"/>
  <rect x="13" y="20" width="12" height="16" rx="2.5" fill="#ffb020"/>
  <!-- teal (rising) candle -->
  <line x1="32" y1="18" x2="32" y2="54" stroke="#19e3c3" stroke-width="3" stroke-linecap="round"/>
  <rect x="26" y="28" width="12" height="18" rx="2.5" fill="#19e3c3"/>
  <!-- tall teal candle -->
  <line x1="45" y1="8" x2="45" y2="44" stroke="#19e3c3" stroke-width="3" stroke-linecap="round"/>
  <rect x="39" y="13" width="12" height="20" rx="2.5" fill="#19e3c3"/>
</svg>
